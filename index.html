
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-a-Sketch </title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="title-container">
        <h1>Etch-a-Sketch</h1>
        <h3>Move your mouse across the canvas and start drawing!</h3>
    </div>

    <div class="main-container">
        <div class="menu-container">
            <div class="color-picker-container">
                <div class="pen-color-box"><input value="#000000" type="color" id="penColor"><span>Pen Color</span></div>
                <div class="background-color-box"><input value="#FFFFFF" type="color" name="backColor" id="backColor"><span>Background Color</span></div>
                <button class="color-fill-button">Color Fill</button>
            </div>

            <div class="mode-button-container">
                <button>Toggle Hover</button>
                <button>Toogle Eraser</button>
                <button>Toogle Rainbow</button>
                <button>Toogle Shading</button>
                <button>Toogle Lighten</button>
            </div>

            <div class="grid-button-container">
                <input value="10" type="range" id="grid-size-input" min="1" max="64" name="grid-size">
                <label for="grid-size">Grid Size: <span>10</span> x <span>10</span></label>
                <button value="gridLines">Toogle Grid Lines</button>
                <button value="clear">Clear</button>
            </div>
        </div>

        <div class="game-container">
            
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
